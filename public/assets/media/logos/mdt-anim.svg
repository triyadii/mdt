<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00174b;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0b1c30;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#grad1)"/>
    
    <!-- Animated circles radiating from center -->
    <circle cx="400" cy="400" r="100" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1">
        <animate attributeName="r" values="100;400" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2;0" dur="4s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="400" cy="400" r="100" fill="none" stroke="#0051d5" stroke-width="4" opacity="0.1">
        <animate attributeName="r" values="100;400" dur="4s" begin="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.15;0" dur="4s" begin="2s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="400" cy="400" r="100" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05">
        <animate attributeName="r" values="100;400" dur="4s" begin="1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.1;0" dur="4s" begin="1s" repeatCount="indefinite" />
    </circle>
</svg>
